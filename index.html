<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CHANT">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="manifest" href="/manifest.json" />
    <title>CHANT</title>
  </head>
  <body>
    <!-- Apple-style Chanting PWA Dynamic Morphing Splash Screen Loader -->
    <div id="splash-loader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
    ">
      <style>
        @media (prefers-color-scheme: dark) {
          #splash-loader {
            background-color: #000000 !important;
          }
          .first-letter, .rest-letters, #splash-logo-circle {
            color: #f5f5f7 !important;
            stroke: #f5f5f7 !important;
          }
          #splash-logo-subcircle {
            stroke: #f5f5f7 !important;
          }
        }
        
        @keyframes splashPulse {
          0% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.02); opacity: 1; }
          100% { transform: scale(1); opacity: 0.8; }
        }

        #splash-text-container {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 12px;
          animation: containerCompress 3.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
          will-change: gap;
        }

        @keyframes containerCompress {
          0% { gap: 12px; }
          40% { gap: 12px; }
          75% { gap: 0px; }
          100% { gap: 0px; }
        }

        .word {
          display: flex;
          align-items: baseline;
          overflow: hidden;
          white-space: nowrap;
        }

        .first-letter {
          font-family: Georgia, Cambria, "Times New Roman", Times, serif;
          color: #1d1d1f;
          text-transform: uppercase;
          font-size: 14px;
          font-weight: 400;
          display: inline-block;
          animation: morphFirst 3.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
          will-change: font-size, margin-right;
        }

        .rest-letters {
          font-family: Georgia, Cambria, "Times New Roman", Times, serif;
          color: #1d1d1f;
          font-size: 14px;
          display: inline-block;
          max-width: 120px;
          opacity: 1;
          animation: fadeOutRest 3.5s cubic-bezier(0.76, 0, 0.24, 1) forwards;
          will-change: max-width, opacity;
        }

        @keyframes fadeOutRest {
          0% { opacity: 1; max-width: 120px; }
          35% { opacity: 1; max-width: 120px; }
          70% { opacity: 0; max-width: 0px; }
          100% { opacity: 0; max-width: 0px; visibility: hidden; }
        }

        @keyframes morphFirst {
          0% { font-size: 14px; font-weight: 400; margin-right: 0px; }
          35% { font-size: 14px; font-weight: 400; margin-right: 0px; }
          75% { font-size: 32px; font-weight: 300; margin-right: 12px; }
          100% { font-size: 32px; font-weight: 300; margin-right: 12px; }
        }

        #splash-subtext {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          font-size: 10px;
          letter-spacing: 2px;
          color: #86868b;
          text-transform: uppercase;
          margin-top: 20px;
          opacity: 0;
          animation: fadeInText 0.5s ease 2.6s forwards;
        }

        @keyframes fadeInText {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      </style>
      
      <!-- Logo animation -->
      <div style="margin-bottom: 24px; animation: splashPulse 3s infinite ease-in-out;">
        <svg width="64" height="64" viewBox="0 0 100 100" fill="none">
          <circle id="splash-logo-circle" cx="50" cy="50" r="48" stroke="#1d1d1f" stroke-width="1.5"/>
          <circle id="splash-logo-subcircle" cx="50" cy="50" r="36" stroke="#1d1d1f" stroke-width="0.75" stroke-dasharray="3 3"/>
          <circle cx="50" cy="50" r="10" fill="none" id="splash-logo-dot" stroke="#86868b" stroke-width="2"/>
        </svg>
      </div>

      <!-- Text Container (Collapsing Full Form -> CHANT) -->
      <div style="display: flex; flex-direction: column; align-items: center; min-height: 80px;">
        <div id="splash-text-container">
          <span class="word"><span class="first-letter">C</span><span class="rest-letters">handas</span></span>
          <span class="word"><span class="first-letter">H</span><span class="rest-letters">euristic</span></span>
          <span class="word"><span class="first-letter">A</span><span class="rest-letters">gentic</span></span>
          <span class="word"><span class="first-letter">N</span><span class="rest-letters">eural</span></span>
          <span class="word"><span class="first-letter">T</span><span class="rest-letters">ext-to-Speech</span></span>
        </div>
        <div id="splash-subtext">Sanskrit Recitation Portal</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Gracefully fade out splash screen after the morph animation finishes and root mounting completes
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('splash-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => {
              loader.style.visibility = 'hidden';
            }, 500);
          }
        }, 3600); // 3.6s allows the full morph (3.5s) and subtext fade-in (2.6s) to satisfy elegantly
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service worker registered'))
            .catch(err => console.log('Service worker registration failed', err));
        });
      }
    </script>
  </body>
</html>
